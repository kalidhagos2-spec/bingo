<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f5c" />
    <meta name="description" content="Play USA Bingo with friends." />
    <title>USA Bingo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://telegram.org" />
    <!-- Painted by the browser before any script arrives, so a slow connection shows the brand
         at once instead of a blank page. React replaces it when the app starts. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b1f5c; }
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #f8fafc; font: 800 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot b { font-size: 40px; letter-spacing: 2px; color: #ffd200; text-shadow: 0 3px 0 #e11d2e; }
      .boot i { width: 22px; height: 22px; border-radius: 50%; border: 4px solid #ffd200; border-top-color: transparent; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- defer: does not hold up the first paint, and still runs before the app module below. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true"><span>USA</span><b>BINGO</b><i></i></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
