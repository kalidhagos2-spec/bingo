server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API (wallet + payment gateways, incl. provider webhooks)
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Multiplayer websocket
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback. The page itself is always revalidated, so players get a new build on their
    # next open instead of whatever their webview cached; the hashed assets below never change.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Amharic call-out clips: fetched once per phone, then served from its cache for a month
    location /audio/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}
