# Render Blueprint: the whole of USA Bingo as two services.
#
#   usabingo      the game server AND the Mini App in one image (Dockerfile.render): one URL
#                 for players, the API, the websocket and the admin dashboard. No CORS to set up.
#   usabingo-bot  the Telegram bot, in webhook mode.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo
# and branch. Render reads this file, asks for the values marked `sync: false`, and builds.
# README.md ("Deploy on Render") walks through it, including the database and the two URLs
# the bot needs after the first deploy.
#
# Plans: `free` services sleep after 15 minutes without traffic and take about a minute to wake;
# tables live in memory, so a sleeping server means no running games (stakes of an unfinished
# round are refunded on shutdown). For real play put `usabingo` on `starter`.

services:
  - type: web
    name: usabingo
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Ethiopia: every tap that needs the server pays this round trip
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # PostgreSQL connection string. A free Render database is deleted after 30 days, which a
      # wallet cannot afford: use Neon (free, permanent) or a paid Render database.
      - key: DATABASE_URL
        sync: false
      # From @BotFather. The same token as the bot service below.
      - key: BOT_TOKEN
        sync: false
      # The secret for /api/admin/dashboard. Use a long random string.
      - key: ADMIN_TOKEN
        sync: false
      # The Telebirr numbers players deposit to, and the names on them (comma separated, paired
      # by position). They can be changed later in the dashboard: Settings > House accounts.
      - key: HOUSE_TELEBIRR_ACCOUNT
        sync: false
      - key: HOUSE_TELEBIRR_NAME
        sync: false
      # Cash-outs are paid from this Telebirr account (shown to players and in the dashboard).
      - key: PAYOUT_METHOD
        value: telebirr
      - key: PAYOUT_ACCOUNT
        sync: false
      - key: PAYOUT_NAME
        sync: false
      # Fees and game rules: the defaults the dashboard's Settings start from.
      - key: DEPOSIT_FEE_PERCENT
        value: "0"
      - key: WITHDRAW_FEE_PERCENT
        value: "2"
      - key: HOUSE_CUT_PERCENT
        value: "20"
      - key: MAX_PRIZE
        value: "3000"
      - key: STAKES
        value: "10,20,50"
      - key: CARTELA_COUNT
        value: "400"
      - key: MAX_CARTELAS
        value: "4"
      - key: MAX_PLAYERS
        value: "55"
      # Demo players are off on a fresh deploy; switch them on in Settings > Demo players.
      - key: DEMO_BOTS
        value: "0"
      - key: DEMO_BOTS_PER_ROOM
        value: "50"
      - key: DEMO_BOTS_SHARE
        value: "0"
      - key: AUTO_APPROVE_DEPOSITS
        value: "false"
      - key: DEV_ALLOW_ANON
        value: "false"
      # PUBLIC_URL / PORT are not listed: Render injects RENDER_EXTERNAL_URL and PORT, and
      # server/src/config.js falls back to RENDER_EXTERNAL_URL for PUBLIC_URL.

  - type: web
    name: usabingo-bot
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: bot/Dockerfile
    dockerContext: bot
    healthCheckPath: /
    envVars:
      # Same values as the usabingo service above.
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      # Both are the URL of the usabingo service (https://usabingo-xxxx.onrender.com), copied
      # from its page after its first deploy: the Mini App and the API now share that one URL.
      - key: WEBAPP_URL
        sync: false
      - key: API_URL
        sync: false
      # Shown by /contact once they exist (Telegram usernames, without the @).
      - key: SUPPORT_USERNAME
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      # WEBHOOK_URL is not listed: Render injects RENDER_EXTERNAL_URL and src/index.js falls back
      # to it, so the bot runs in webhook mode with no extra setup.
