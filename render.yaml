# Render Blueprint for the server + bot (the webapp deploys separately to Vercel/Netlify --
# see the "Deploy for free" section in README.md for the full walkthrough, including the
# manual steps below that a blueprint can't fill in for you: which env vars need a real
# value after each service's first deploy).
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo.
# Render finds this file automatically. Both services are on the free plan (see README for
# what that means: they sleep after 15 min idle, ~1 min cold start on the next request).
#
# Env vars marked `sync: false` below are prompted for during setup, or can be filled in
# afterward from each service's Environment tab in the Render dashboard.

services:
  - type: web
    name: tg-bingo-server
    runtime: docker
    plan: free
    dockerfilePath: server/Dockerfile
    dockerContext: server
    healthCheckPath: /api/health
    envVars:
      # Neon (or any Postgres) connection string. See README's "Deploy for free" section.
      - key: DATABASE_URL
        sync: false
      # From @BotFather. Same token as the bot service below -- rotate it first if it was
      # ever shared or committed (see the security note in TODO.md).
      - key: BOT_TOKEN
        sync: false
      # The webapp's Vercel URL (e.g. https://your-app.vercel.app), once you have it -- set
      # after the Vercel deploy. Comma-separated if you add a second origin later (a preview
      # deployment URL, a custom domain).
      - key: ALLOWED_ORIGINS
        sync: false
      # Operator access to /api/admin (house ledger, kicking players, etc.). Leave blank to
      # skip for now; set to a real secret before you rely on the admin dashboard.
      - key: ADMIN_TOKEN
        sync: false
      # Deposits: set HOUSE_TELEBIRR_ACCOUNT / HOUSE_TELEBIRR_NAME (and CBEBIRR / BOA) to your
      # receiving accounts; add TELEBIRR_* / CHAPA_* vars for online checkout (see server/.env.example).
      - key: HOUSE_TELEBIRR_ACCOUNT
        sync: false
      - key: HOUSE_TELEBIRR_NAME
        sync: false
      - key: HOUSE_CBEBIRR_ACCOUNT
        sync: false
      - key: HOUSE_CBEBIRR_NAME
        sync: false
      - key: DEV_ALLOW_ANON
        value: "false"
      # PUBLIC_URL / PORT are not listed here: Render injects RENDER_EXTERNAL_URL and PORT
      # automatically, and server/src/config.js falls back to RENDER_EXTERNAL_URL for
      # PUBLIC_URL when it's not set explicitly.

  - type: web
    name: tg-bingo-bot
    runtime: docker
    plan: free
    dockerfilePath: bot/Dockerfile
    dockerContext: bot
    healthCheckPath: /
    envVars:
      # Same value as tg-bingo-server's DATABASE_URL above.
      - key: DATABASE_URL
        sync: false
      # Same value as tg-bingo-server's BOT_TOKEN above.
      - key: BOT_TOKEN
        sync: false
      # The webapp's Vercel URL -- same value as tg-bingo-server's ALLOWED_ORIGINS above.
      - key: WEBAPP_URL
        sync: false
      # tg-bingo-server's own Render URL (e.g. https://tg-bingo-server-xxxx.onrender.com).
      # Free services can't reach each other over Render's private network (only paid
      # services can *receive* private traffic), so this has to be the public URL -- copy it
      # from the server service's page once it has deployed once.
      - key: API_URL
        sync: false
      # WEBHOOK_URL is not listed here: Render injects RENDER_EXTERNAL_URL automatically,
      # and src/index.js falls back to it, so the bot switches to webhook mode with no extra
      # setup. (WEBHOOK_URL only needs to be set by hand on a host that doesn't provide that.)
